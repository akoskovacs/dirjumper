name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upstream

      - name: Bump version
        id: bump
        run: |
          OLD_VERSION=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$OLD_VERSION"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          NEW_VERSION="${major}.${minor}.${patch}"
          echo "$NEW_VERSION" > VERSION
          sed -i "s/^VERSION=\"${OLD_VERSION}\"/VERSION=\"${NEW_VERSION}\"/" dj.sh

          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version sync
        run: |
          FILE_VERSION=$(cat VERSION)
          SCRIPT_VERSION=$(grep -oP '^VERSION="\K[^"]+' dj.sh)
          if [ "$FILE_VERSION" != "$SCRIPT_VERSION" ]; then
            echo "::error::Version mismatch: VERSION=$FILE_VERSION, dj.sh=$SCRIPT_VERSION"
            exit 1
          fi

      - name: Push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION dj.sh
          git commit -m "Bump version to v${{ steps.bump.outputs.new_version }}"
          git push origin HEAD:refs/heads/release/v${{ steps.bump.outputs.new_version }}

      - name: Open PR to upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          gh pr create \
            --base upstream \
            --head "release/v${NEW_VERSION}" \
            --title "Bump version to v${NEW_VERSION}" \
            --body "$(cat <<EOF
          Bumped from v${OLD_VERSION} → v${NEW_VERSION} (${BUMP_TYPE}).

          After this is merged, open a PR from \`upstream\` → \`master\` to cut the release.
          EOF
          )"
